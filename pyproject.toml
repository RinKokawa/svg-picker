[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svg-picker"
version = "1.0.0"
description = "A native GUI tool to search and pick SVG icons from Iconify"
readme = "README.md"
license = "MIT"
authors = [
    { name = "RinKokawa", email = "rin@rinco.cc" }
]
keywords = ["svg", "icon", "picker", "iconify", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7.0",
    "ruff>=0.1",
    "twine>=4.0",
]

[project.scripts]
svg-picker = "svg_picker.app:main"

[project.urls]
Homepage = "https://github.com/RinKokawa/svg-picker"
Source = "https://github.com/RinKokawa/svg-picker"
Issues = "https://github.com/RinKokawa/svg-picker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/svg_picker"]
