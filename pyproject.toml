[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svg-picker"
version = "0.1.0"
description = "A native GUI tool to search and pick SVG icons from Iconify"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["svg", "icon", "picker", "iconify", "gui"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "requests>=2.28",
]

[project.scripts]
svg-picker = "svg_picker.app:main"

[project.urls]
Homepage = "https://github.com/yourname/svg-picker"

[tool.hatch.build.targets.wheel]
packages = ["src/svg_picker"]
